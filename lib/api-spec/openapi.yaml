openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Bitgold account, wallet, mining, team, and administration API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Username and account-key authentication
  - name: account
    description: Signed-in account and profile
  - name: wallet
    description: Wallet balances and auditable transactions
  - name: mining
    description: Mining claims and platform statistics
  - name: team
    description: Referral network
  - name: admin
    description: Server-authorized administrative operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create an account with a generated account key
      description: Creates the account, its wallet balances, and its first active session. The first account ever created receives the initial administrator role atomically. The generated account key is returned once and stored only as a salted scrypt hash.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSignUpInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSignUpResult"
        "400":
          description: The username is not acceptable
        "409":
          description: That username is already taken
  /auth/login:
    post:
      operationId: signIn
      tags: [auth]
      summary: Start a session with a username and account key
      description: Verifies the account key against its stored hash. When the account already has an active device session, the response is a 409 carrying a pending token that must be confirmed through the device switch operation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResult"
        "400":
          description: A username and account key are required
        "401":
          description: The username or account key was not accepted
        "403":
          description: This account is suspended
        "409":
          description: This account is active on another device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthDeviceConflict"
  /auth/logout:
    post:
      operationId: signOut
      tags: [auth]
      summary: End the current session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session ended
        "401":
          description: Authentication required
  /auth/key/rotate:
    post:
      operationId: rotateAccountKey
      tags: [auth]
      summary: Replace the account key
      description: Verifies the current key, stores only the new salted hash, and ends every other device session.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthKeyRotateInput"
      responses:
        "200":
          description: Key rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthKeyRotateResult"
        "400":
          description: The replacement key is not acceptable
        "401":
          description: The current account key was not accepted
        "409":
          description: This account is active on another device
  /account:
    get:
      operationId: getAccount
      tags: [account]
      summary: Get the signed-in user's account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          description: Authentication required
  /account/device/switch:
    post:
      operationId: switchAccountDevice
      tags: [account]
      summary: Move the account's active session to this device
      description: Called with the pending session token returned by a conflicting sign-in. The confirmed session becomes the account's only active session.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Device switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          description: Authentication required
  /profile:
    patch:
      operationId: updateProfile
      tags: [account]
      summary: Update editable profile details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [account]
      summary: Get dashboard data
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /platform/stats:
    get:
      operationId: getPlatformStats
      tags: [mining]
      summary: Get public platform statistics
      responses:
        "200":
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"
  /mining/claim:
    post:
      operationId: claimMining
      tags: [mining]
      summary: Claim the current mining reward
      responses:
        "200":
          description: Claim accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiningClaim"
        "409":
          description: A claim is not currently available
  /team:
    get:
      operationId: getTeam
      tags: [team]
      summary: Get referral team details
      responses:
        "200":
          description: Referral team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get wallet assets, balances, and recent ledger activity
      responses:
        "200":
          description: Current wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
  /wallet/deposits:
    post:
      operationId: requestDeposit
      tags: [wallet]
      summary: Submit a deposit for manual confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositInput"
      responses:
        "201":
          description: Pending deposit request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransaction"
  /wallet/withdrawals:
    post:
      operationId: requestWithdrawal
      tags: [wallet]
      summary: Submit a withdrawal request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Pending withdrawal request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransaction"
        "409":
          description: Duplicate request or insufficient available balance
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get administrative overview
      responses:
        "200":
          description: Overview for an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Administrator access required
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: Search and list accounts
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [all, active, banned]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Matching accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "403":
          description: Administrator access required
  /admin/users/{userId}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: Get account details and wallet history
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account details for an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "403":
          description: Administrator access required
        "404":
          description: Account not found
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Ban or unban an account
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Administrator access required
        "409":
          description: The initial administrator cannot be banned
  /admin/deposits:
    get:
      operationId: getAdminDeposits
      tags: [admin]
      summary: List deposit requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending, confirmed, rejected]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Deposit requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransactionPage"
        "403":
          description: Administrator access required
  /admin/deposits/{depositId}/decision:
    post:
      operationId: decideDeposit
      tags: [admin]
      summary: Confirm or reject a pending deposit exactly once
      parameters:
        - name: depositId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositDecision"
      responses:
        "200":
          description: Updated deposit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransaction"
        "403":
          description: Administrator access required
        "409":
          description: Deposit has already been decided
  /admin/withdrawals:
    get:
      operationId: getAdminWithdrawals
      tags: [admin]
      summary: List withdrawal requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending, approved, rejected]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Withdrawal requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransactionPage"
        "403":
          description: Administrator access required
  /admin/withdrawals/{withdrawalId}/decision:
    post:
      operationId: decideWithdrawal
      tags: [admin]
      summary: Approve or reject a pending withdrawal exactly once
      parameters:
        - name: withdrawalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalDecision"
      responses:
        "200":
          description: Updated withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransaction"
        "403":
          description: Administrator access required
        "409":
          description: Withdrawal has already been decided
  /admin/ip-clusters:
    get:
      operationId: getAdminIpClusters
      tags: [admin]
      summary: Review public-IP account clusters
      responses:
        "200":
          description: Admin-only shared-IP review signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpClusterPage"
        "403":
          description: Administrator access required
  /admin/audit:
    get:
      operationId: getAdminAudit
      tags: [admin]
      summary: Review administrative and ledger audit events
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "403":
          description: Administrator access required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token issued by the sign-up, sign-in, or device-switch operations.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthSignUpInput:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        referralCode:
          type: string
          maxLength: 32
      additionalProperties: false
    AuthLoginInput:
      type: object
      required: [username, key]
      properties:
        username: { type: string }
        key: { type: string }
      additionalProperties: false
    AuthSignUpResult:
      type: object
      required: [token, accountKey, account]
      properties:
        token: { type: string }
        accountKey: { type: string }
        account: { $ref: "#/components/schemas/Account" }
    AuthSessionResult:
      type: object
      required: [token, account]
      properties:
        token: { type: string }
        account: { $ref: "#/components/schemas/Account" }
    AuthDeviceConflict:
      type: object
      required: [error, code, token, account]
      properties:
        error: { type: string }
        code: { type: string, enum: [DEVICE_SESSION_MISMATCH] }
        token: { type: string }
        account: { $ref: "#/components/schemas/Account" }
    AuthKeyRotateInput:
      type: object
      required: [currentKey]
      properties:
        currentKey: { type: string }
        newKey: { type: string, minLength: 16, maxLength: 200 }
      additionalProperties: false
    AuthKeyRotateResult:
      type: object
      required: [accountKey]
      properties:
        accountKey: { type: string }
    ProfileUpdate:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 80
        country:
          type: string
          maxLength: 80
      additionalProperties: false
    Account:
      type: object
      required: [id, username, role, status, balance, availableBalance, pendingBalance, hashPower, streak, totalMined, totalReferralEarnings, totalClaims, referralCode, isInitialAdmin]
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, user] }
        status: { type: string, enum: [active, banned] }
        displayName: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        balance: { type: number }
        availableBalance: { type: number }
        pendingBalance: { type: number }
        hashPower: { type: number }
        streak: { type: integer }
        lastClaimDate: { type: ["string", "null"], format: date-time }
        totalMined: { type: number }
        totalReferralEarnings: { type: number }
        totalClaims: { type: integer }
        referralCode: { type: string }
        isInitialAdmin: { type: boolean }
    Dashboard:
      type: object
      required: [account, stats, recentTransactions]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        stats: { $ref: "#/components/schemas/PlatformStats" }
        recentTransactions:
          type: array
          items: { $ref: "#/components/schemas/WalletTransaction" }
    PlatformStats:
      type: object
      required: [totalUsers, totalMined, activeMiners, totalClaims]
      properties:
        totalUsers: { type: integer }
        totalMined: { type: number }
        activeMiners: { type: integer }
        totalClaims: { type: integer }
    MiningClaim:
      type: object
      required: [amount, balance, nextClaimAt]
      properties:
        amount: { type: number }
        balance: { type: number }
        nextClaimAt: { type: string, format: date-time }
    TeamMember:
      type: object
      required: [username, joinedAt, totalEarned]
      properties:
        username: { type: string }
        joinedAt: { type: string, format: date-time }
        totalEarned: { type: number }
        level: { type: integer, enum: [1, 2] }
    Team:
      type: object
      required: [referralCode, level1Count, level2Count, totalReferralEarnings, level1, level2]
      properties:
        referralCode: { type: string }
        level1Count: { type: integer }
        level2Count: { type: integer }
        totalReferralEarnings: { type: number }
        level1:
          type: array
          items: { $ref: "#/components/schemas/TeamMember" }
        level2:
          type: array
          items: { $ref: "#/components/schemas/TeamMember" }
    WalletAsset:
      type: object
      required: [symbol, name, balance, availableBalance, pendingBalance, priceUsd, change24h]
      properties:
        symbol: { type: string }
        name: { type: string }
        balance: { type: number }
        availableBalance: { type: number }
        pendingBalance: { type: number }
        priceUsd: { type: number }
        change24h: { type: number }
    WalletTransaction:
      type: object
      required: [id, type, assetSymbol, amount, status, description, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        username: { type: ["string", "null"] }
        type: { type: string, enum: [deposit, withdrawal, mining, referral, transfer] }
        assetSymbol: { type: string }
        amount: { type: number }
        status: { type: string, enum: [pending, confirmed, rejected, approved, completed] }
        description: { type: string }
        walletAddress: { type: ["string", "null"] }
        network: { type: ["string", "null"] }
        transactionHash: { type: ["string", "null"] }
        adminNote: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: ["string", "null"], format: date-time }
    Wallet:
      type: object
      required: [assets, transactions, availableBalance, pendingBalance]
      properties:
        assets:
          type: array
          items: { $ref: "#/components/schemas/WalletAsset" }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/WalletTransaction" }
        availableBalance: { type: number }
        pendingBalance: { type: number }
    DepositInput:
      type: object
      required: [assetSymbol, amount, idempotencyKey]
      properties:
        assetSymbol: { type: string, minLength: 2, maxLength: 12 }
        amount: { type: number, exclusiveMinimum: 0 }
        transactionHash: { type: string, maxLength: 160 }
        idempotencyKey: { type: string, minLength: 12, maxLength: 80 }
      additionalProperties: false
    WithdrawalInput:
      type: object
      required: [assetSymbol, amount, walletAddress, idempotencyKey]
      properties:
        assetSymbol: { type: string, minLength: 2, maxLength: 12 }
        amount: { type: number, exclusiveMinimum: 0 }
        walletAddress: { type: string, minLength: 10, maxLength: 160 }
        network: { type: string, maxLength: 40 }
        idempotencyKey: { type: string, minLength: 12, maxLength: 80 }
      additionalProperties: false
    WalletTransactionPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WalletTransaction" }
        total: { type: integer }
    DepositDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [confirmed, rejected] }
        note: { type: string, maxLength: 500 }
      additionalProperties: false
    WithdrawalDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        transactionHash: { type: string, maxLength: 160 }
        note: { type: string, maxLength: 500 }
      additionalProperties: false
    AdminOverview:
      type: object
      required: [totalUsers, activeUsers, bannedUsers, pendingDeposits, pendingWithdrawals, sharedIpGroups, totalBalance]
      properties:
        totalUsers: { type: integer }
        activeUsers: { type: integer }
        bannedUsers: { type: integer }
        pendingDeposits: { type: integer }
        pendingWithdrawals: { type: integer }
        sharedIpGroups: { type: integer }
        totalBalance: { type: number }
    AdminUser:
      type: object
      required: [id, username, role, status, balance, joinedAt, isInitialAdmin]
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, user] }
        status: { type: string, enum: [active, banned] }
        balance: { type: number }
        joinedAt: { type: string, format: date-time }
        isInitialAdmin: { type: boolean }
    AdminUserPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        total: { type: integer }
    AdminUserDetail:
      type: object
      required: [user, walletBalances, transactions]
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        walletBalances:
          type: array
          items: { $ref: "#/components/schemas/WalletAsset" }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/WalletTransaction" }
    AdminUserUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, banned] }
      additionalProperties: false
    IpCluster:
      type: object
      required: [publicIp, accountCount, accounts, firstSeenAt, lastSeenAt]
      properties:
        publicIp: { type: string }
        accountCount: { type: integer }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
    IpClusterPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IpCluster" }
    AuditEvent:
      type: object
      required: [id, actorUsername, action, target, createdAt]
      properties:
        id: { type: string }
        actorUsername: { type: string }
        action: { type: string }
        target: { type: string }
        details: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    AuditEventPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        total: { type: integer }

